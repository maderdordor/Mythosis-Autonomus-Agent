[setup]
# Force Nixpacks to only use the Node provider, ignoring Python
providers = ["node"]

[phases.setup]
# Ensure pnpm is available
nixPkgs = ["nodejs_20", "corepack"]
cmds = ["corepack enable", "corepack prepare pnpm@9.4.0 --activate"]

[phases.install]
cmds = ["pnpm install"]

[phases.build]
cmds = ["pnpm run build"]

[start]
cmd = "pnpm run start"
